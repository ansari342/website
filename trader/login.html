<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in · Trading Lab</title>
  <meta name="theme-color" content="#0e0c0b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ff4d2e'/><text x='50' y='72' font-family='Arial Black,Arial' font-weight='900' font-size='58' text-anchor='middle' fill='%230e0c0b'>A</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <header class="head">
    <a href="/" class="head__logo" aria-label="Back to the main site">AA</a>
    <span class="head__console mono">Trading lab · Private</span>
  </header>

  <main class="login">
    <p class="mono label">(Private) Trading lab</p>
    <h1>Sign in</h1>
    <p class="lede">This area is private. Sign in with an approved Google account to continue.</p>
    <div id="google-button" class="google"></div>
    <p id="message" class="message mono" role="status"></p>
  </main>

  <script>
    const msg = document.getElementById("message");
    const say = (t) => { msg.textContent = t; };

    async function onCredential(resp) {
      say("Checking your account…");
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ credential: resp.credential }),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok) {
          say("Signed in. Opening the lab…");
          location.href = "/trader/";
        } else {
          say(body.error || "Sign-in failed.");
        }
      } catch (_) {
        say("Couldn't reach the server. Try again.");
      }
    }

    async function start() {
      let clientId = null;
      try {
        const res = await fetch("/api/config", { cache: "no-store" });
        if (res.ok) clientId = (await res.json()).googleClientId;
      } catch (_) {}
      if (!clientId) {
        say("Sign-in isn't set up on this server yet.");
        return;
      }
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true;
      s.onload = () => {
        google.accounts.id.initialize({ client_id: clientId, callback: onCredential, auto_select: false });
        google.accounts.id.renderButton(document.getElementById("google-button"), {
          theme: "filled_black",
          size: "large",
          shape: "pill",
          text: "signin_with",
          width: 280,
        });
      };
      s.onerror = () => say("Couldn't load Google sign-in.");
      document.head.appendChild(s);
    }
    start();
  </script>
</body>
</html>
